# Development override: the app as a bind-mounted watch process. It is NOT
# usable on its own, and it deliberately contains NO database.
#
# With a database in the stack (the usual local setup):
#
#   docker compose -f docker/docker-compose.yml \
#     -f docker/docker-compose.dev.yml \
#     -f docker/docker-compose.db.yml up
#
# Against a database that already exists elsewhere — a shared Atlas Local
# container, or cloud Atlas — omit the db file and say where it is:
#
#   MONGODB_URI='mongodb://host.docker.internal:27017/?directConnection=true' \
#     docker compose -f docker/docker-compose.yml \
#       -f docker/docker-compose.dev.yml up
#
# (or put that line in ../.env, which the base file reads.)
#
# If the shared database is a container on a shared docker network, reaching it
# by name beats going out through a published port on the host. That wiring is
# machine-specific, so it lives in a gitignored override — copy
# docker-compose.local.yml.example and read the notes in it:
#
#   docker compose -f docker/docker-compose.yml \
#     -f docker/docker-compose.dev.yml \
#     -f docker/docker-compose.local.yml up
#
# Use the db file OR the local override, never both: each supplies a database.
#
# WHY THIS FILE NAMES NO DATABASE. Compose rejects a `depends_on` pointing at a
# service no file defines, so a dependency on `mongodb` here would make the db
# file mandatory — exactly what splitting them was meant to avoid. Both the
# dependency and the compose-network MONGODB_URI therefore live in
# docker-compose.db.yml, next to the service they describe. Nothing here refers
# to `mongodb` at all, and MONGODB_URI is left to .env or the shell.
#
# Only the differences from docker-compose.yml appear below.

services:
  app:
    build:
      target: dev
      args:
        NODE_ENV: development
    # Tagged separately so a dev build never overwrites the production tag.
    image: ragkb-app:dev
    # A stable name to exec into and a stable hostname in the logs. The app
    # holds no persistent state keyed by hostname, so this is convenience
    # rather than correctness — unlike the db container, where it is
    # load-bearing.
    container_name: ragkb-app-dev
    hostname: ragkb-app-dev
    command: ['npm', 'run', 'dev']
    # Overrides the base file's `unless-stopped`. If the process cannot start at
    # all — a bad env var, a missing module — you want to read the error once,
    # not watch it scroll past in a restart loop.
    restart: 'no'

    # NOTE ON PRECEDENCE: entries written as `KEY=value` here beat anything in
    # the base file's `env_file: ../.env`, so MONGODB_DB_NAME, LOG_LEVEL and
    # MCP_AUTH_TOKEN must be overridden from the shell or via `--env-file`
    # rather than from ../.env. The defaults exist so `up` works on a clean
    # checkout with no .env at all.
    #
    # MONGODB_URI is conspicuously absent: it is the one setting that depends on
    # where the database actually is, so it comes from .env or the shell, or
    # from docker-compose.db.yml when that file supplies the database itself.
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # Human-readable pino output via pino-pretty; production stays NDJSON.
      - LOG_PRETTY=true
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-rag_kb_dev}
      # Obviously-not-a-secret default so `up` works on a clean checkout with no
      # .env; zod only requires >= 16 characters. Override it for anything that
      # is reachable from outside your machine.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-dev-local-token-not-a-secret}

    volumes:
      # Host source mounted read-write so `tsx watch` picks up IDE saves with no
      # rebuild and no container restart. Paths are relative to docker/, hence
      # the leading `../`. The container runs as uid 1000, which owns these
      # files on the host, so nothing needs chown-ing.
      - ../src:/app/src
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - ../package.json:/app/package.json
      - ../package-lock.json:/app/package-lock.json
      - ../tsconfig.json:/app/tsconfig.json
      - ../tsconfig.build.json:/app/tsconfig.build.json
      - ../vitest.config.ts:/app/vitest.config.ts
      - ../eslint.config.js:/app/eslint.config.js
      - ../.prettierrc.json:/app/.prettierrc.json
      # node_modules must stay container-owned. The host tree is installed for
      # the host platform (and may not exist at all), so letting it show through
      # at /app/node_modules is the classic "Cannot find module 'express'" —
      # this named volume masks it with the image's own install.
      - node_modules:/app/node_modules

volumes:
  node_modules:
