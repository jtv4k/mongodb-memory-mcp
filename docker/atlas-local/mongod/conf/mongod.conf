# mongod configuration — DOCUMENTATION / PORTABILITY ONLY
#
# ⚠ Atlas Local does NOT read this file.
#
# The mongodb/mongodb-atlas-local image is supervised by /usr/local/bin/runner,
# which launches mongod with explicit command-line flags and offers no
# configuration-file hook. Editing this file changes nothing while the dev stack
# runs on Atlas Local. See ../../README.md for the full explanation.
#
# It is kept for two reasons:
#   1. it records the effective configuration in the conventional location, and
#   2. it is what takes effect if this service is ever replaced by a plain
#      `mongod` + `mongot` pair, where flags are not portable but this file is.
#
# The settings below mirror the flags runner actually passes, so the two do not
# drift into disagreeing with each other.

storage:
  dbPath: /data/db

net:
  bindIpAll: true
  port: 27017
  # runner passes --maxConns 32200
  maxIncomingConnections: 32200

replication:
  # runner generates a random replica set name per container, e.g. 52997997eb98.
  # A fixed name only applies in the plain-mongod case.
  replSetName: rs0

security:
  # The SHARED mongod <-> mongot keyfile. runner generates it on first boot.
  keyFile: /data/configdb/keyfile
  # runner passes --transitionToAuth so the single-node set can bootstrap before
  # any user exists. Do not enable full auth here without also provisioning users.
  transitionToAuth: true

setParameter:
  # Points mongod at the mongot (Atlas Search) process inside the same container.
  # This pairing is what makes $search and $vectorSearch work locally.
  mongotHost: localhost:27027
  searchIndexManagementHostAndPort: localhost:27027

systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true
